name: Collector and Airflow transformation tests

on:
  pull_request:
    paths:
      - "coletor/**"
      - "airflow/**"
      - "scripts/**"
      - ".github/workflows/python-pipeline-tests.yml"
  push:
    branches: [main]
    paths:
      - "coletor/**"
      - "airflow/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r coletor/requirements.txt -r airflow/requirements.txt
      - name: Validate Docker Compose configuration
        run: |
          cp coletor/.env.example .env
          docker compose config --quiet
      - name: Guard against broken Superset admin command
        run: |
          docker compose config --format json > /tmp/compose-rendered.json
          python - <<'PY'
          import json
          with open("/tmp/compose-rendered.json", encoding="utf-8") as f:
              services = json.load(f)["services"]
          cmd = services["superset"]["command"]
          text = " ".join(cmd) if isinstance(cmd, list) else str(cmd)
          assert "--firstname Admin --lastname User" in text, "Superset admin CLI split by newline"
          assert "env_file" not in services["coletor"], "collector requires missing root .env"
          PY
      - name: Compile Python scripts
        run: python -m compileall -q coletor airflow/dags
      - name: Test collector
        run: python -m unittest discover -s coletor/tests -v
      - name: Test fact validation
        run: python -m unittest discover -s airflow/tests -v
      - name: Validate Superset export scripts
        run: |
          bash -n scripts/export_superset.sh
          python -m unittest discover -s scripts/tests -v
